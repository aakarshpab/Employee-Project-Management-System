{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Proflow{% endblock %}</title>
    
    <!-- Custom Favicon Image Link -->
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">

    <style>
        :root {
            --primary-color: #3b4d61;     /* Sophisticated slate blue */
            --primary-hover: #273645;
            --bg-color: #f7f7f9;        /* Minimal warm off-white background */
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --text-main: #2b3748;
            --text-muted: #718096;
            --border-color: #edf2f7;
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 76px;
            --transition-speed: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.5;
            display: flex;
            min-height: 100vh;
        }

        /* Classy Collapsible Sidebar */
        aside.sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            transition: width var(--transition-speed);
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.015);
        }

        aside.sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
        }

        .sidebar-header {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 73px;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            overflow: hidden;
            white-space: nowrap;
            transition: opacity var(--transition-speed);
        }

        /* Custom Logo Image Styling */
        .brand-logo-img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            border-radius: 0.375rem;
            flex-shrink: 0;
        }

        .sidebar-brand h1 {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.025em;
        }

        .sidebar-brand h1 a {
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .sidebar-brand h1 a:hover {
            color: var(--primary-color);
        }

        /* Minimal Hamburger Toggle Button */
        .sidebar-toggle {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.375rem;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .sidebar-toggle:hover {
            background-color: #f1f5f9;
            color: var(--primary-color);
        }

        .sidebar-toggle svg {
            width: 18px;
            height: 18px;
        }

        /* Navigation Links */
        .sidebar-nav {
            padding: 1rem 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            flex: 1;
            overflow-x: hidden;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 0.7rem 0.85rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .sidebar-nav a svg {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
        }

        .sidebar-nav a span {
            transition: opacity var(--transition-speed), visibility var(--transition-speed);
        }

        .sidebar-nav a:hover {
            background-color: #f8fafc;
            color: var(--primary-color);
        }

        .sidebar-nav a.active {
            background-color: #f1f5f9;
            color: var(--primary-color);
            font-weight: 600;
        }

        /* Collapsed State Adjustments */
        aside.sidebar.collapsed .sidebar-brand h1,
        aside.sidebar.collapsed .sidebar-nav a span,
        aside.sidebar.collapsed .admin-link span,
        aside.sidebar.collapsed .sidebar-version {
            opacity: 0;
            visibility: hidden;
            width: 0;
            display: none;
        }

        aside.sidebar.collapsed .sidebar-header {
            justify-content: center;
            padding: 1.25rem 0.5rem;
        }

        aside.sidebar.collapsed .sidebar-brand {
            gap: 0;
        }

        aside.sidebar.collapsed .sidebar-nav a,
        aside.sidebar.collapsed .admin-link {
            justify-content: center;
            padding: 0.7rem;
        }

        /* Sidebar Footer */
        .sidebar-footer {
            padding: 0.85rem 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            background-color: #fafbfc;
            overflow: hidden;
            white-space: nowrap;
        }

        .admin-link {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            padding: 0.6rem 0.85rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }

        .admin-link svg {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
        }

        .admin-link:hover {
            background-color: #f1f5f9;
            color: var(--primary-color);
        }

        .sidebar-version {
            font-size: 0.7rem;
            color: var(--text-muted);
            padding-left: 0.85rem;
            opacity: 0.7;
        }

        /* Main Content Fluid Layout */
        main.main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            min-height: 100vh;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            transition: margin-left var(--transition-speed);
        }

        main.main-content.expanded {
            margin-left: var(--sidebar-collapsed-width);
        }

        /* Responsive Mobile Behavior */
        @media (max-width: 768px) {
            aside.sidebar {
                width: var(--sidebar-collapsed-width);
            }
            aside.sidebar .sidebar-brand h1,
            aside.sidebar .sidebar-version,
            aside.sidebar .sidebar-nav a span,
            aside.sidebar .admin-link span {
                display: none;
            }
            main.main-content {
                margin-left: var(--sidebar-collapsed-width);
            }
            .sidebar-toggle {
                display: none;
            }
        }
    </style>
</head>
<body>

    <aside class="sidebar" id="appSidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <!-- Loads logo.png from core/static/images/ -->
                <img src="{% static 'images/logo.png' %}" alt="Proflow Logo" class="brand-logo-img">
                <h1><a href="{% url 'home' %}">Proflow</a></h1>
            </div>
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle Sidebar">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>
        
        <nav class="sidebar-nav">
            <a href="{% url 'home' %}" {% if request.resolver_match.url_name == 'home' %}class="active"{% endif %}>
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span>Home</span>
            </a>
            <a href="{% url 'employee_list' %}" {% if 'employee' in request.resolver_match.url_name %}class="active"{% endif %}>
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span>Employees</span>
            </a>
            <a href="{% url 'project_list' %}" {% if 'project' in request.resolver_match.url_name %}class="active"{% endif %}>
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                <span>Projects</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="/admin/" class="admin-link">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span>Admin</span>
            </a>
            <span class="sidebar-version">Proflow v1.0</span>
        </div>
    </aside>

    <main class="main-content" id="mainContent">
        {% block content %}
        {% endblock %}
    </main>

    <script>
        const toggleBtn = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('appSidebar');
        const mainContent = document.getElementById('mainContent');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            mainContent.classList.toggle('expanded');
        });
    </script>
</body>
</html>
