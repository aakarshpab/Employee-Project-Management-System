<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AakarsHub{% endblock %}</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --sidebar-width: 220px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.5;
            display: flex;
            min-height: 100vh;
        }

        /* Compact Sidebar Styling */
        aside.sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            box-shadow: 1px 0 3px 0 rgba(0, 0, 0, 0.02);
        }

        .sidebar-header {
            padding: 1.1rem 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .sidebar-logo-badge {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: #ffffff;
            font-weight: 800;
            font-size: 0.9rem;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.35rem;
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
            flex-shrink: 0;
        }

        .sidebar-brand h1 {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.025em;
        }

        .sidebar-brand h1 a {
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .sidebar-brand h1 a:hover {
            color: var(--primary-color);
        }

        .sidebar-nav {
            padding: 1rem 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            flex: 1;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.875rem;
            padding: 0.6rem 0.75rem;
            border-radius: 0.35rem;
            transition: all 0.2s ease;
        }

        .sidebar-nav a svg {
            flex-shrink: 0;
            width: 16px;
            height: 16px;
        }

        .sidebar-nav a:hover {
            background-color: #f1f5f9;
            color: var(--primary-color);
        }

        .sidebar-nav a.active {
            background-color: #e0e7ff;
            color: var(--primary-color);
            font-weight: 600;
        }

        /* Sidebar Footer (Admin + Version) */
        .sidebar-footer {
            padding: 0.75rem 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            background-color: #fafafa;
        }

        .admin-link {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            padding: 0.5rem 0.75rem;
            border-radius: 0.35rem;
            transition: all 0.2s ease;
        }

        .admin-link svg {
            flex-shrink: 0;
            width: 16px;
            height: 16px;
        }

        .admin-link:hover {
            background-color: #f1f5f9;
            color: var(--primary-color);
        }

        .sidebar-version {
            font-size: 0.68rem;
            color: var(--text-muted);
            padding-left: 0.75rem;
            opacity: 0.8;
        }

        /* Main Content Layout */
        main.main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            min-height: 100vh;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 768px) {
            :root {
                --sidebar-width: 64px;
            }
            aside.sidebar .sidebar-brand h1,
            aside.sidebar .sidebar-version,
            aside.sidebar .sidebar-nav a span,
            aside.sidebar .admin-link span {
                display: none;
            }
            aside.sidebar .sidebar-logo-badge {
                margin: 0 auto;
            }
            aside.sidebar .sidebar-header {
                padding: 1rem 0.5rem;
                justify-content: center;
            }
            aside.sidebar .sidebar-nav a,
            aside.sidebar .admin-link {
                justify-content: center;
                padding: 0.6rem;
            }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <div class="sidebar-logo-badge">P</div>
                <h1><a href="{% url 'home' %}">Proflow</a></h1>
            </div>
        </div>
        
        <nav class="sidebar-nav">
            <a href="{% url 'home' %}">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span>Home</span>
            </a>
            <a href="{% url 'employee_list' %}">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span>Employees</span>
            </a>
            <a href="{% url 'project_list' %}">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                <span>Projects</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="/admin/" class="admin-link">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span>Admin</span>
            </a>
            <span class="sidebar-version">Proflow v1.0</span>
        </div>
    </aside>

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
